services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_USE_MSW: ${VITE_USE_MSW:-false}
        SYNC_SWAGGER: ${SYNC_SWAGGER:-false}
    image: trainee-match-frontend:local
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    environment:
      BACKEND_URL: ${BACKEND_URL:-https://api.traineematch.space}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

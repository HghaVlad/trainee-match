server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Backend microservices — single host, path-based routing with path rewriting
    # /api/v1/auth/* -> /api/auth/*
    # /api/v1/candidate/* -> /api/candidate/candidate/*
    # /api/v1/resume/* -> /api/candidate/resume/*
    # /api/v1/skill/* -> /api/candidate/skill/*
    # /api/v1/companies/* -> /api/company/companies/*
    # /api/v1/vacancies/* -> /api/company/vacancies/*
    # /api/v1/applications/* -> /api/application/applications/*
    location /api/v1/auth {
        set $upstream_backend ${BACKEND_URL};
        rewrite ^/api/v1(/.*)$ $1 break;
        proxy_pass $upstream_backend/api/auth$1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/candidate {
        set $upstream_backend ${BACKEND_URL};
        rewrite ^/api/v1(/.*)$ $1 break;
        proxy_pass $upstream_backend/api/candidate/candidate$1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/resume {
        set $upstream_backend ${BACKEND_URL};
        rewrite ^/api/v1(/.*)$ $1 break;
        proxy_pass $upstream_backend/api/candidate/resume$1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/skill {
        set $upstream_backend ${BACKEND_URL};
        rewrite ^/api/v1(/.*)$ $1 break;
        proxy_pass $upstream_backend/api/candidate/skill$1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/companies {
        set $upstream_backend ${BACKEND_URL};
        rewrite ^/api/v1(/.*)$ $1 break;
        proxy_pass $upstream_backend/api/company/companies$1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/vacancies {
        set $upstream_backend ${BACKEND_URL};
        rewrite ^/api/v1(/.*)$ $1 break;
        proxy_pass $upstream_backend/api/company/vacancies$1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/applications {
        set $upstream_backend ${BACKEND_URL};
        rewrite ^/api/v1/applications/?(.*)$ /api/application/applications/$1 break;
        proxy_pass $upstream_backend/api/application/applications/$1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

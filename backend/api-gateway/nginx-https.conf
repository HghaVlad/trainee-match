events {}

http {
    gzip on;
    gzip_types application/json;

    client_max_body_size 10M;

    # rate limiting
    limit_req_status 429;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

    # logging
    log_format api_gateway
        '$remote_addr [$time_local] '
        '"$request" $status '
        'rt=$request_time '
        'urt="$upstream_response_time" '
        '"$http_user_agent"';

    access_log /dev/stdout api_gateway;
    error_log /dev/stderr warn;

    # upstreams (for load balancing having multiple instances)
    upstream candidate_backend {
        server candidate-service:8081;
        keepalive 32;
    }

    upstream company_backend {
        server company-service:8080;
        keepalive 32;
    }

    upstream application_backend {
        server application-service:8080;
        keepalive 32;
    }

    upstream auth_backend {
        server auth-service:8000;
        keepalive 32;
    }

    upstream keycloak_backend {
        server keycloak:8080;
        keepalive 32;
    }

    # http -> https redirect
    server {
        listen 80;

        server_name api.traineematch.space;

        return 301 https://$host$request_uri;
    }

    # https api gw
    server {
        listen 443 ssl;
        http2 on;

        # ssl + domain
        server_name api.traineematch.space;
        ssl_certificate /etc/letsencrypt/live/api.traineematch.space/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.traineematch.space/privkey.pem;

        # limit_req zone=api_limit burst=30 nodelay;

        # timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Candidate service
        location /api/candidate/ {
            rewrite ^/api/candidate/(.*)$ /api/v1/$1 break;

            proxy_pass http://candidate_backend;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Company service
        location /api/company/ {
            rewrite ^/api/company/(.*)$ /api/v1/$1 break;

            proxy_pass http://company_backend;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Application service
        location /api/application/ {
            rewrite ^/api/application/(.*)$ /api/v1/$1 break;

            proxy_pass http://application_backend;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Auth service
        location /api/auth/ {
            # limit_req zone=auth_limit burst=10 nodelay;

            rewrite ^/api/auth/(.*)$ /api/v1/$1 break;

            proxy_pass http://auth_backend;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Keycloak
        location /keycloak/ {
            proxy_pass http://keycloak_backend/;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
        }

        # Healthcheck
        location = /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok";
        }
    }

    upstream frontend_backend {
        server frontend:80;
        keepalive 32;
    }

    # frontend http -> https
    server {
        listen 80;

        server_name traineematch.space www.traineematch.space;

        return 301 https://$host$request_uri;
    }

    # frontend https
    server {
        listen 443 ssl;
        http2 on;

        server_name traineematch.space www.traineematch.space;

        ssl_certificate /etc/letsencrypt/live/traineematch.space/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/traineematch.space/privkey.pem;

        #
        # API ROUTING
        #

        location /api/v1/admin/companies {
            rewrite ^/api/v1/admin/companies(.*)$ /api/company/admin/companies$1 break;
            proxy_pass https://api.traineematch.space;
            include /etc/nginx/proxy_params;
        }

        location /api/v1/admin/vacancies {
            rewrite ^/api/v1/admin/vacancies(.*)$ /api/company/admin/vacancies$1 break;
            proxy_pass https://api.traineematch.space;
            include /etc/nginx/proxy_params;
        }

        location /api/v1/admin/candidates {
            rewrite ^/api/v1/admin/candidates(.*)$ /api/candidate/admin/candidates$1 break;
            proxy_pass https://api.traineematch.space;
            include /etc/nginx/proxy_params;
        }

        location /api/v1/admin/skills {
            rewrite ^/api/v1/admin/skills(.*)$ /api/candidate/admin/skills$1 break;
            proxy_pass https://api.traineematch.space;
            include /etc/nginx/proxy_params;
        }

        location /api/v1/admin/resumes {
            rewrite ^/api/v1/admin/resumes(.*)$ /api/candidate/admin/resumes$1 break;
            proxy_pass https://api.traineematch.space;
            include /etc/nginx/proxy_params;
        }

        location /api/v1/admin/new {
            rewrite ^/api/v1/admin/new(.*)$ /api/auth/admin/new$1 break;
            proxy_pass https://api.traineematch.space;
            include /etc/nginx/proxy_params;
        }

        location /api/v1/auth {
            rewrite ^/api/v1/auth(.*)$ /api/auth/auth$1 break;
            proxy_pass https://api.traineematch.space;
            include /etc/nginx/proxy_params;
        }

        location /api/v1/candidate {
            rewrite ^/api/v1/candidate(.*)$ /api/candidate/candidate$1 break;
            proxy_pass https://api.traineematch.space;
            include /etc/nginx/proxy_params;
        }

        location /api/v1/resume {
            rewrite ^/api/v1/resume(.*)$ /api/candidate/resume$1 break;
            proxy_pass https://api.traineematch.space;
            include /etc/nginx/proxy_params;
        }

        location /api/v1/skill {
            rewrite ^/api/v1/skill(.*)$ /api/candidate/skill$1 break;
            proxy_pass https://api.traineematch.space;
            include /etc/nginx/proxy_params;
        }

        location /api/v1/companies {
            rewrite ^/api/v1/companies(.*)$ /api/company/companies$1 break;
            proxy_pass https://api.traineematch.space;
            include /etc/nginx/proxy_params;
        }

        location /api/v1/vacancies {
            rewrite ^/api/v1/vacancies(.*)$ /api/company/vacancies$1 break;
            proxy_pass https://api.traineematch.space;
            include /etc/nginx/proxy_params;
        }

        location /api/v1/applications {
            rewrite ^/api/v1/applications(.*)$ /api/application/applications$1 break;
            proxy_pass https://api.traineematch.space;
            include /etc/nginx/proxy_params;
        }

        location /api/v1/hr {
            rewrite ^/api/v1/hr(.*)$ /api/application/hr$1 break;
            proxy_pass https://api.traineematch.space;
            include /etc/nginx/proxy_params;
        }

        #
        # FRONTEND SPA
        #

        location / {
            proxy_pass http://frontend_backend;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
events {}

http {
    gzip on;
    gzip_types application/json;

    client_max_body_size 10M;

    server {
        listen 80;

        # Candidate service
        location /api/candidate/ {
            rewrite ^/api/candidate/(.*)$ /api/v1/$1 break;

            proxy_pass http://candidate-service:8080;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Company service
        location /api/company/ {
            rewrite ^/api/company/(.*)$ /api/v1/$1 break;

            proxy_pass http://company-service:8080;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Application service
        location /api/application/ {
            rewrite ^/api/application/(.*)$ /api/v1/$1 break;

            proxy_pass http://application-service:8080;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Auth service
        location api/auth/ {
            rewrite ^/api/auth/(.*)$ /api/v1/auth/$1 break;

            proxy_pass http://auth-service:8080;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Healthcheck
        location = /health {
            access_log off;

            add_header Content-Type text/plain;

            return 200 "ok";
        }
    }
}

services:
  keycloak-postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
      POSTGRES_DB: keycloak
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U keycloak -d keycloak" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.5
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HTTP_MANAGEMENT_PORT: 9000

      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    depends_on:
      keycloak-postgres:
        condition: service_healthy

    volumes:
      - ./auth/import:/opt/keycloak/data/import

  auth-service:
    build:
      context: auth
    environment:
      KC_URL: http://keycloak:8080
      KC_REALM: trainee-match
      KC_CLIENT_ID: auth_backend
      KC_CLIENT_SECRET: UAaVKlGqGXZs2LXZPiV3uFYCblmrEhJ8
      KC_ADMIN_USERNAME: admin
      KC_ADMIN_PASSWORD: admin

      KAFKA_BROKERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      KAFKA_CLIENT_ID: auth
      KAFKA_PRODUCER_ACKS: all
      KAFKA_PRODUCER_LINGER: 10ms
      KAFKA_USER_TOPIC: user.events

      SCHEMA_REGISTRY_URL: http://schema-registry:8081

      OUTBOX_USER_TOPIC: user.events
      OUTBOX_BASE_RETRY_DELAY: 5s
      OUTBOX_MAX_RETRIES: 5
      OUTBOX_BATCH_SIZE: 100
      OUTBOX_RELAY_MIN_SLEEP: 50ms
      OUTBOX_RELAY_MAX_SLEEP: 5s
      OUTBOX_RELAY_WORKER_COUNT: 2

      POSTGRES_HOST: auth-postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB_NAME: auth_db
      POSTGRES_SSL_MODE: disable
    ports:
      - "8000:8000"
    depends_on:
      keycloak:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy
      auth-postgres:
        condition: service_healthy

  auth-postgres:
    image: postgres:17
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - auth-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d auth_db" ]
      interval: 20s
      timeout: 5s
      retries: 15
      start_period: 10s

  candidate-db:
    image: postgres:17
    ports:
      - "5432:5432"
    volumes:
      - candidate-db-data:/var/lib/postgresql/data
    env_file:
      - ./candidate/.env
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${CANDIDATE_PGS_USER} -d ${CANDIDATE_PGS_NAME}" ]
      interval: 20s
      timeout: 5s
      retries: 15
      start_period: 10s

  candidate-service:
    build:
      context: .
      dockerfile: candidate/Dockerfile
    env_file:
      - ./candidate/.env
    ports:
      - "8081:8081"
      - "8085:8085"
    depends_on:
      candidate-db:
        condition: service_healthy
      schema-registry-init:
        condition: service_completed_successfully
      auth-service:
        condition: service_started

  company-postgres:
    image: postgres:17
    env_file:
      - company/.env
    ports:
      - "5433:5432"
    volumes:
      - company-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${COMPANY_PGS_USER} -d ${COMPANY_PGS_NAME}" ]
      interval: 20s
      timeout: 5s
      retries: 15
      start_period: 10s

  company-postgres-migrate:
    image: migrate/migrate
    volumes:
      - ./company/internal/infrastructure/db/postgres/migrations:/migrations
    command: [
      "-path", "/migrations",
      "-database", "postgres://${COMPANY_PGS_USER}:${COMPANY_PGS_PASS}@company-postgres:5432/${COMPANY_PGS_NAME}?sslmode=disable",
      "up"
    ]
    depends_on:
      company-postgres:
        condition: service_healthy

  redis-cache:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5

  company-service:
    build:
      context: ./company
    env_file:
      - company/.env
    ports:
      - "8088:8080"
    depends_on:
      company-postgres:
        condition: service_healthy
      company-postgres-migrate:
        condition: service_completed_successfully
      redis-cache:
        condition: service_healthy
      schema-registry-init:
        condition: service_completed_successfully
      auth-service:
        condition: service_started
      elasticsearch:
        condition: service_healthy

  application-postgres:
    image: postgres:17
    ports:
      - "5434:5432"
    env_file:
      - application/.env
    volumes:
      - application-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${APPLICATION_PGS_USER} -d ${APPLICATION_PGS_NAME}"  ]
      interval: 20s
      timeout: 5s
      retries: 15
      start_period: 10s

  application-postgres-migrate:
    image: migrate/migrate
    volumes:
      - ./application/internal/infrastructure/db/postgres/migrations:/migrations
    command: [
      "-path", "/migrations",
      "-database", "postgres://${APPLICATION_PGS_USER}:${APPLICATION_PGS_PASS}@application-postgres:5432/${APPLICATION_PGS_NAME}?sslmode=disable",
      "up"
    ]
    depends_on:
      application-postgres:
        condition: service_healthy

  application-service:
    build:
      context: ./application
    env_file:
      - application/.env

    ports:
      - "8086:8080"
    depends_on:
      application-postgres:
        condition: service_healthy
      application-postgres-migrate:
        condition: service_completed_successfully
      schema-registry-init:
        condition: service_completed_successfully
      auth-service:
        condition: service_started


  kafka-1:
    image: apache/kafka:4.2.0
    ports:
      - "19092:19092"
    environment:
      KAFKA_KRAFT_CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092,EXTERNAL://localhost:19092  # questionable localhost
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_MIN_INSYNC_REPLICAS: 2

    volumes:
      - kafka_1_data:/var/lib/kafka/data

  kafka-2:
    image: apache/kafka:4.2.0
    ports:
      - "19093:19092"
    environment:
      KAFKA_KRAFT_CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092,EXTERNAL://localhost:19093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_MIN_INSYNC_REPLICAS: 2

    volumes:
      - kafka_2_data:/var/lib/kafka/data

  kafka-3:
    image: apache/kafka:4.2.0
    ports:
      - "19094:19092"
    environment:
      KAFKA_KRAFT_CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092,EXTERNAL://localhost:19094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_MIN_INSYNC_REPLICAS: 2

    volumes:
      - kafka_3_data:/var/lib/kafka/data

  kafka-init:
    image: apache/kafka:4.2.0
    entrypoint: [ "/bin/bash", "/scripts/kafka-init.sh" ]
    volumes:
      - ./scripts/kafka-init.sh:/scripts/kafka-init.sh:ro
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8089:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
    depends_on:
      kafka-init:
        condition: service_completed_successfully


  schema-registry:
    image: confluentinc/cp-schema-registry:8.2.0
    ports:
      - "8083:8081"
    environment:
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka-1:9092,PLAINTEXT://kafka-2:9092,PLAINTEXT://kafka-3:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/subjects" ]
      interval: 5s
      timeout: 3s
      retries: 20

  schema-registry-init:
    image: alpine:3.20
    entrypoint: >
      sh -c "
        apk add --no-cache curl jq bash &&
        /scripts/register-schemas.sh
      "
    environment:
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      SCHEMA_DIR: /schemas
      SCHEMA_REGISTRY_COMPATIBILITY: BACKWARD
    volumes:
      - ./scripts/register-schemas.sh:/scripts/register-schemas.sh:ro
      - ./api/avro:/schemas:ro
    depends_on:
      schema-registry:
        condition: service_healthy

  nginx-api-gw:
    build: ./api-gateway
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro # enable for https if u are on the machine
    depends_on:
      - auth-service
      - candidate-service
      - company-service
      - application-service

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.3.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${ELASTIC_PASS}
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.ml.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -u elastic:${ELASTIC_PASS} -fsSL http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  kibana:
    image: docker.elastic.co/kibana/kibana:9.3.0
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${ELASTIC_KIBANA_PASS}
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  keycloak-db-data:
  candidate-db-data:
  company-pg-data:
  redis_data:
  application-pg-data:
  kafka_1_data:
  kafka_2_data:
  kafka_3_data:
  auth-pg-data:
  elasticsearch_data: